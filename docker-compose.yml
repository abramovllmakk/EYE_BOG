# Quick start:  docker compose up -d --build   then   docker compose run --rm traffic
#               docker compose run --rm history   # two weeks of demo history for the dashboards
# UI: http://localhost:4001   proxy for tests: http://localhost:4000/graphql   demo API: http://localhost:4100/graphql
name: gqlcov

services:
  demo-api:
    build: { context: ., target: demo }
    ports: ['4100:4100']

  gqlcov:
    build: { context: ., target: server }
    ports: ['4000:4000', '4001:4001']
    environment:
      TARGET_URL: http://demo-api:4100/graphql
      GQLCOV_TARGETS__0__NAME: demo
      GQLCOV_LOGGING__LEVEL: info
      GQLCOV_QUEUE__FLUSH_INTERVAL_MS: '250'
      # PostgreSQL instead of SQLite:
      #   DATABASE_URL=postgres://gqlcov:gqlcov@postgres:5432/gqlcov docker compose --profile postgres up -d
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - gqlcov-data:/data
    depends_on:
      demo-api: { condition: service_healthy }

  traffic:
    build: { context: ., target: traffic }
    profiles: [demo]
    environment:
      PROXY_URL: http://gqlcov:4000/graphql
      RUN_ID: ${RUN_ID:-}
      BRANCH: ${BRANCH:-main}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
    depends_on:
      gqlcov: { condition: service_healthy }

  # Two weeks of demo history (teams, branches, growing coverage): docker compose run --rm history
  history:
    build: { context: ., target: traffic }
    profiles: [demo]
    command: ['node', 'src/history.mjs']
    environment:
      PROXY_URL: http://gqlcov:4000/graphql
      ADMIN_URL: http://gqlcov:4001
    depends_on:
      gqlcov: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment: { POSTGRES_USER: gqlcov, POSTGRES_PASSWORD: gqlcov, POSTGRES_DB: gqlcov }
    ports: ['5432:5432']
    volumes:
      - gqlcov-pg:/var/lib/postgresql/data

volumes:
  gqlcov-data:
  gqlcov-pg:
